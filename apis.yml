x-coverage:
  state: covered
  reason: no_institution_operated_api
  detail: 'UCL publishes no institution-operated, publicly callable API. Its one genuinely institution-operated
    machine-readable surface is the UCL Discovery OAI-PMH endpoint, which is live but sits behind a Cloudflare
    challenge (403) and could not be read unattended. Every other surface found is a vendor tenancy: Figshare,
    Symplectic, Ex Libris, Funnelback and OpenAthens. UCL API (uclapi.com), which WAS UCL''s own engineering
    and the strongest university developer surface in this catalog, is fully retired — no TCP connection completes
    on uclapi.com, api.uclapi.com, docs.uclapi.com or status.uclapi.com. Its 12 contracts and every artifact
    derived from them were removed; the source repositories are kept as pointers. One further UCL-authored
    OpenAPI exists (github.com/UCL/isenseflu-openapi, ''(c) 2019 UCL'', GPL-3.0) but it declares no servers[]
    and every candidate deployment host is dead, so it was NOT registered as a surface. This is a correct thin
    profile: the absence is the finding, and the score should fall accordingly.'
