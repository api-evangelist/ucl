aid: ucl
name: UCL
description: 'University College London (UCL) is a public research university in London, United Kingdom, and
  a member of the Russell Group. UCL is the clearest illustration in this cohort of why a university is a federation
  of buyers rather than a producer of APIs. Its flagship developer surface, UCL API (uclapi.com) — a student-built,
  ISD-backed, open-source, OAuth2-secured platform exposing room bookings, timetables, staff search, desktop
  and study-space availability and workspaces — was genuinely UCL''s own engineering, and as of 2026-08-19
  its entire estate is gone: uclapi.com, api.uclapi.com, docs.uclapi.com and status.uclapi.com all fail to
  complete a TCP connection on either port 80 or 443. The source repository remains public and unarchived (github.com/uclapi/uclapi,
  last pushed 2026-05-06); the OpenAPI repository was archived in 2021. What remains is almost entirely bought,
  not built. UCL Discovery, the open-access institutional repository, is the one institution-operated machine-readable
  surface left standing: EPrints on UCL''s own domain with an OAI-PMH endpoint, currently behind a Cloudflare
  challenge. Everything else is a tenancy — the UCL Research Data Repository is Figshare (rdr.ucl.ac.uk CNAMEs
  to figshare.com, UCL''s data addressed as institution=549 on Figshare''s shared host), UCL Profiles is Symplectic
  Elements (profiles.ucl.ac.uk CNAMEs to ucl.discovery.symplectic.org), library discovery is Ex Libris Primo
  VE, site search is Funnelback, and even UCL''s UK Access Management Federation identity provider — the one
  class of surface a university is supposed to operate by definition — resolves its SAML SSO to OpenAthens
  rather than to a UCL host. UCL owns the entityID, the ucl.ac.uk scope and the DataCite DOI prefix 10.5522;
  vendors run the services underneath them. No central developer portal, no open data portal and no publicly
  callable institution-operated API were found in this pass.'
