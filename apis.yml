x-retired:
- host: uclapi.com
  verdict: dead
  evidence: https=000, http=000
  checked: '2026-08-19'
  entries_removed: 12
  note: 'DNS still resolves to an EC2 host in eu-west-2; it answers on neither 80 nor 443. The contracts were
    the institution''s own — retired for liveness, not attribution. The OpenAPI pointer was unwired too: a
    contract pointer with no reachable API behind it would score contract_present for a service nobody can
    call. Source and spec repos are still public and are kept as GitHub/SourceCode pointers.'
  source_still_published: https://github.com/uclapi/uclapi-openapi (HTTP 200)
  source_repo: https://github.com/uclapi/uclapi (HTTP 200, pushed 2026-05-06, not archived)
  derivatives_removed:
    checked: '2026-08-19'
    note: 'The dead-host pass removed the 7 OpenAPIs and their json-schema/, examples/, rules/, vocabulary/,
      scopes/, authentication/, json-ld/ and json-structure/ derivatives, but left two sets behind. Both descend
      from the same retired contract and were removed in this pass for consistency: every one of the 14 Postman/OpenCollection
      files targets the dead uclapi.com host, and the agentic-access artifact declared `source: openapi/ucl-uclapi.yaml`,
      a file that no longer exists, while describing x-agentic-access execution contracts for 29 operations
      nobody can call. Leaving them would have credited UCL with a callable collection set and an agent-governance
      posture for a retired service.'
    paths:
    - collections/ (14 files + .refine-report.opencollection.json)
    - agentic-access/ucl-agentic-access.yml
