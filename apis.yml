- aid: ucl:research-data-repository
  name: UCL Research Data Repository (Figshare tenancy)
  description: 'The UCL Research Data Repository is UCL''s institutional data repository, used to deposit,
    archive, publish and mint DOIs for research datasets. The data, the curation policy and the DOI prefix
    (10.5522, registered to UCL as DataCite client BL.UCLD) are UCL''s. The platform is not: rdr.ucl.ac.uk
    CNAMEs directly to figshare.com, re3data records softwareName=figshare, and UCL''s holdings are addressed
    on Figshare''s shared host as api.figshare.com/v2/articles?institution=549 and api.figshare.com/v2/oai?set=portal_549.
    Figshare''s contract is deliberately NOT saved under this institution — it is one document that 25 universities
    in this catalog were previously credited with authoring. The tenancy itself is recorded here because it
    is a real institutional fact and one of UCL''s few remaining programmable surfaces.'
