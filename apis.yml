- aid: ucl:discovery-oai
  name: UCL Discovery — OAI-PMH
  description: UCL Discovery is UCL's open-access institutional repository of research outputs, running EPrints
    on UCL's own registrable domain, and it exposes an OAI-PMH 2.0 metadata-harvesting endpoint at discovery.ucl.ac.uk/cgi/oai2.
    This is the only surface in this profile whose host, software deployment and endpoint are all UCL's. A
    direct probe on 2026-08-19 was answered with a Cloudflare challenge interstitial (HTTP 403, 'Just a moment...')
    rather than an OAI-PMH response, so the endpoint is live but not readable unattended; the endpoint address
    and the EPrints software are independently confirmed by UCL's entry in the re3data repository registry
    (r3d100012417). No OpenAPI or other machine-readable contract is published for it.
